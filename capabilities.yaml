# Capability levels for every vendored skill, under two profiles.
#
# This file is the data behind docs/research/harness-capability-chart.md: the
# matrix in that document is generated from it (`lqcowork chart`), and the
# harness probe skill and the site judge every skill against it. See
# docs/CONTRACT.md section 4b for the schema.
#
#   codes      one entry per capability. `evidence` lists the probes in
#              probes.yaml whose results decide the capability for every
#              skill (its primary probes). `column: false` marks the
#              auxiliary codes the chart does not draw as matrix columns.
#   unprobed   codes deliberately left without a probe, each with a reason.
#   skills     <name>: group, then one block per profile:
#                upstream  the skill as vendored in upstream/skills/
#                cowork    the adapted card as built into the Cowork bundles
#              Each profile block has:
#                levels     CODE or CODE:facet -> R (required), D (degradable:
#                           the skill documents a fallback), O (optional).
#                           A facet narrows a code to one thing a probe tests
#                           (OUT:pdf-assemble is "build a PDF from chosen
#                           pages"); it has no primary probes of its own.
#                evidence   extra probes, per code or facet, on top of the
#                           code's primary evidence.
#                needs      (upstream) exact runtime the scripts need; P1's
#                           facts are judged against it for EXEC and BIN.
#                fallbacks  for every D: the skill's own words for what
#                           happens without it, and where they are.
#                notes      (cowork) what the adaptation changed.
#
# TOOLS is derived, not audited: it is the strongest level among the action
# codes (OUT FS PERSIST EXEC BIN NET SEARCH VISION DOCX SUB SESSION SCHED MCP
# HASH SKILLDIR, facets included). Validation (LQC-K006) holds it to that.

codes:
  - id: TOOLS
    name: Tool execution
    summary: The harness gives the model callable tools, runs each call and returns the result within the turn.
    evidence: [P25]
  - id: MCP
    name: MCP connection
    summary: Connect to an MCP server (local stdio or remote HTTP), discover its tools and route calls to it; equivalent connector mechanisms count.
    evidence: [P15]
  - id: IN
    name: Read supplied files
    summary: Read files the user supplies (pdf, docx, xlsx, eml, text, images) whole.
    evidence: [P26]
  - id: OUT
    name: Hand back files
    summary: Write a file and hand it to the user.
    evidence: [P27]
  - id: FS
    name: Real filesystem
    summary: User-named paths, recursive folder walks, run and sibling output folders, stable paths.
    evidence: [P16]
  - id: PERSIST
    name: Storage that outlives the session
    summary: A file written in one session can be found in a later one without being attached again.
    evidence: [P2]
  - id: EXEC
    name: Run bundled scripts
    summary: Run the skills' bundled Python scripts; P1's facts are judged against each skill's exact needs.
    evidence: [P1]
  - id: BIN
    name: External executables
    summary: Poppler, LibreOffice, tesseract, headless Chromium, an SVG rasteriser or the codex CLI on the path.
    evidence: [P1]
  - id: NET
    name: Fetch a URL
    summary: Fetch a public page and quote it; skills that hash what they fetch add the raw-bytes probe.
    evidence: [P12]
  - id: SEARCH
    name: Web search
    summary: Search the web and return an address the user can check.
    evidence: [P6]
  - id: VISION
    name: See rendered pages
    summary: The model looks at a rendered page image and reports what is on it.
    evidence: [P4]
  - id: DOCX
    name: Word OOXML structure
    summary: Read tracked changes, comments and tables in a Word file, not just its text.
    evidence: [P3]
  - id: SUB
    name: Isolated workers
    summary: A fresh-context worker that sees only its packet, with the model chosen per worker.
    evidence: [P19]
  - id: SESSION
    name: Conversation transcripts
    summary: Quote the current session's own words and events, and say which are read and which reconstructed.
    evidence: [P11]
  - id: SCHED
    name: Background or scheduled runs
    summary: A run that happens after the turn ends and can read and write files.
    evidence: [P13]
  - id: HTML
    name: Interactive HTML round trip
    summary: The user opens a generated offline HTML page, and the file it downloads comes back to the skill.
    evidence: [P20]
  - id: HASH
    name: File digest by the host
    summary: Compute a SHA-256 of a file where no bundled script does it for the skill.
    evidence: [P17]
    column: false
  - id: SKILLDIR
    name: Skill folder on disk
    summary: The skill's scripts, assets and sibling skills are reachable by path.
    evidence: [P21]
    column: false
  - id: INVOKE
    name: Call a skill by name
    summary: An explicit-invocation-only skill does not fire on its own, but fires when the user calls it by name.
    evidence: [P24]
    column: false

unprobed: []

skills:
  legalquants:
    group: companion
    upstream:
      levels:
        TOOLS: D
        FS: D
        PERSIST: D
        EXEC: D
        SKILLDIR: D
        INVOKE: R
      needs:
        python: '3.11'
      fallbacks:
        TOOLS:
          text: 'No explicit tool fallback. Closest: a verb that is not installed is not an option; say
            the next step in plain words instead and move on.'
          ref: upstream/skills/companion/legalquants/SKILL.md:51-54
        FS:
          text: 'No explicit fallback for an unreadable ~/.lq. Closest: store status returning exists:false
            is ''a normal answer, never an error''.'
          ref: upstream/skills/companion/legalquants/SKILL.md:46
        PERSIST:
          text: '''{"exists": false}'' is a normal answer, never an error (missing store is expected on
            a fresh machine).'
          ref: upstream/skills/companion/legalquants/SKILL.md:46
        EXEC:
          text: 'No explicit fallback for missing scripts. Closest: exists:false is normal, and only skills
            that appear in catalog output may be offered; otherwise say the next step in plain words.'
          ref: upstream/skills/companion/legalquants/SKILL.md:46,51-54
        SKILLDIR:
          text: Sibling scripts (onboarding.py, ../lq-reflect profile_store.py, ../lq-start catalog.py)
            are called by relative path. Same closest wording as EXEC; the SKILL.md states no fallback for
            an unreachable skill folder.
          ref: upstream/skills/companion/legalquants/SKILL.md:38-54
    cowork:
      levels:
        TOOLS: D
        IN: D
        FS: D
        PERSIST: O
      fallbacks:
        TOOLS:
          text: If they say the note is already in their Cowork folder, ask what it is called, look for
            it, and say in one line whether you found it.
          ref: dist/legalquants-companion-cowork/skills/legalquants/SKILL.md:58-60
        IN:
          text: With nothing to go on, ask one question rather than guess.
          ref: dist/legalquants-companion-cowork/skills/legalquants/SKILL.md:68-69
        FS:
          text: Look for the named note and say in one line whether you found it; name anything looked for
            and not found before saying where they are.
          ref: dist/legalquants-companion-cowork/skills/legalquants/SKILL.md:58-60,65-68
      notes: Removed the onboarding marker, ~/.lq profile, store counters and catalog script (no scripts,
        no PERSIST, no SKILLDIR); it now works from the conversation plus an attached lqplaybook.md or note
        and states what it had. Frontmatter has no disable-model-invocation, so no INVOKE.
  lq-apply:
    group: companion
    upstream:
      levels:
        TOOLS: R
        IN: O
        OUT: R
        FS: O
        PERSIST: D
        EXEC: D
        NET: D
        SKILLDIR: D
        INVOKE: R
      needs:
        python: '3.11'
      fallbacks:
        PERSIST:
          text: 'Empty or missing store: say so honestly and start one now, then compile from what they
            give you in this session. Never send them away to wait.'
          ref: upstream/skills/companion/lq-apply/SKILL.md:64-67
        EXEC:
          text: already_shown, another_session_is_showing_it or any error -> straight to the task. The task
            is never gated on this.
          ref: upstream/skills/companion/lq-apply/SKILL.md:33-35
        NET:
          text: Fetch the form's current fields when reachable; when unreachable, say the draft is provisional
            - never claim a fixed field count or an exact form match.
          ref: upstream/skills/companion/lq-apply/SKILL.md:98-101
        SKILLDIR:
          text: Sibling scripts ../legalquants/scripts/onboarding.py and ../lq-reflect/scripts/profile_store.py;
            failure path is 'any error -> straight to the task' plus the short-conversation source when
            nothing else exists.
          ref: upstream/skills/companion/lq-apply/SKILL.md:33-35,62
    cowork:
      levels:
        TOOLS: R
        IN: D
        OUT: R
        FS: D
        PERSIST: O
        NET: O
        DOCX: O
      fallbacks:
        IN:
          text: 'Nothing kept, nothing attached: say so honestly and compile from what they give you in
            this session. A normal way to run this, not a degraded one.'
          ref: dist/legalquants-companion-cowork/skills/lq-apply/SKILL.md:72-74
        FS:
          text: If they say it is already in their Cowork folder, ask what it is called, look for it, and
            say in one line whether you found it; never carry on as though you had.
          ref: dist/legalquants-companion-cowork/skills/lq-apply/SKILL.md:49-51
      notes: Dropped the onboarding marker, ~/.lq store reads, the live assess.legalquants.com fetch and
        the whole application format; now drafts a CV or profile from attached files or conversation and
        writes the draft plus an evidence-notes file to the Output folder (Word doc via the host Word skill
        on request). OUT rated R because the card names an Output file as where the draft goes and gives
        no fallback if it cannot be written, though the draft is also shown verbatim in chat.
  lq-ask:
    group: companion
    upstream:
      levels:
        TOOLS: D
        MCP: D
        IN: O
        EXEC: D
        NET: D
        SKILLDIR: D
        INVOKE: R
      needs:
        python: '3.11'
      fallbacks:
        TOOLS:
          text: 'If lq-mcp is not available: say so in one plain line (''the live corpus isn''t reachable
            from here'') and work from the public surfaces in references/sources.md instead.'
          ref: upstream/skills/companion/lq-ask/SKILL.md:61-66
        MCP:
          text: 'If it is not available: say so in one plain line and work from the public surfaces instead.
            Never pretend a citation from that file is a live query result.'
          ref: upstream/skills/companion/lq-ask/SKILL.md:61-66
        EXEC:
          text: 'onboarding.py: any error -> straight to the task. evidence.py: no resolution -> cite the
            build''s title and description only, with no invented profile link.'
          ref: upstream/skills/companion/lq-ask/SKILL.md:37-39,77-80
        NET:
          text: Name the source sets actually searched and any that were unavailable. Unavailable is said,
            not implied. Never claim a source you did not retrieve.
          ref: upstream/skills/companion/lq-ask/SKILL.md:82-85
        SKILLDIR:
          text: Scripts/source_access.py plus ../legalquants/scripts/evidence.py and onboarding.py by relative
            path; same wording as EXEC (error -> straight to the task; no resolution -> title and description
            only).
          ref: upstream/skills/companion/lq-ask/SKILL.md:37-39,73-80
    cowork:
      levels:
        TOOLS: O
        SEARCH: O
      fallbacks: {}
      notes: Replaced the live lq-mcp, GitHub and builds-directory lookups and all scripts with a dated
        static library in references/sources.md that the model only reads; asks nothing of the host beyond
        chat. Deep Research is mentioned only as something the user may ask for themselves. No disable-model-invocation
        in frontmatter, so no INVOKE.
  lq-connect:
    group: companion
    upstream:
      levels:
        TOOLS: R
        EXEC: D
        NET: R
        SKILLDIR: D
        INVOKE: R
      needs:
        python: '3.11'
      fallbacks:
        EXEC:
          text: No hit anywhere -> the existing known-for/works line stands on its own, silently; this step
            never stalls the hand-over and is never surfaced as a gap.
          ref: upstream/skills/companion/lq-connect/SKILL.md:91-94
        SKILLDIR:
          text: Calls ../legalquants/scripts/evidence.py and onboarding.py by relative path; failure paths
            are 'any error -> straight to the task' and the no-hit line above.
          ref: upstream/skills/companion/lq-connect/SKILL.md:33-35,82-94
    cowork:
      levels:
        TOOLS: D
        IN: O
        SEARCH:org: D
      evidence:
        SEARCH:org:
        - P14
      fallbacks:
        TOOLS:
          text: Nobody fits well? Say so plainly, say what you searched and what you could not see, and
            suggest the search the lawyer could run themselves.
          ref: dist/legalquants-companion-cowork/skills/lq-connect/SKILL.md:94-97
        SEARCH:
          text: 'Nobody fits well? Say so plainly, say what you searched and what you could not see. A document
            this session cannot open is not evidence: name it as unopened and move on. A brought list is
            a second pool.'
          ref: dist/legalquants-companion-cowork/skills/lq-connect/SKILL.md:68-71,78-81,94-97
        SEARCH:org:
          text: 'Nobody fits well? Say so plainly, say what you searched and what you could not see. A document
            this session cannot open is not evidence: name it as unopened and move on. A brought list is
            a second pool.'
          ref: dist/legalquants-companion-cowork/skills/lq-connect/SKILL.md:68-71,78-81,94-97
      notes: Replaced the public legalquants.com directory fetch and evidence.py excerpts with a hand-off
        to the host Enterprise Search skill over the organisation's own material, plus an optional directory
        or attendee list the lawyer attaches. SEARCH rated D (not R) because the brought-list pool and the
        honest-miss answer remain when search is unavailable; the card gives no wording specific to a missing
        Enterprise Search skill.
  lq-mirror:
    group: companion
    upstream:
      levels:
        TOOLS: O
        OUT: O
        PERSIST: O
        EXEC: O
        SKILLDIR: O
        INVOKE: R
      needs:
        python: '3.11'
      fallbacks: {}
    cowork:
      levels:
        TOOLS: O
        OUT: O
      fallbacks: {}
      notes: 'Removed the onboarding marker, store save door and live catalog ending; the twelve-question
        conversation is pure chat and the summary is shown in the reply. OUT O only because, if asked, the
        summary is handed over as a note they can save to their own folder (SKILL.md:62-63), which the host
        may realise as an Output file. No INVOKE: built frontmatter lacks disable-model-invocation.'
  lq-reflect:
    group: companion
    upstream:
      levels:
        TOOLS: R
        IN: R
        OUT: O
        FS: R
        PERSIST: R
        EXEC: R
        SUB: D
        SESSION: R
        SKILLDIR: R
      needs:
        python: '3.11'
      fallbacks:
        SUB:
          text: Second read, where the host has parallel workers. Without workers, skip this and say so
            in one line; the debrief is complete without it.
          ref: upstream/skills/companion/lq-reflect/SKILL.md:199-205
    cowork:
      levels:
        TOOLS: O
        IN: O
        OUT: O
        FS: O
        PERSIST: O
        SESSION: O
      fallbacks: {}
      notes: Dropped the ~/.lq store, transcript scanners, manifests, window mode and the subagent second
        read; reviews only this conversation plus attached or Input-folder files, and on yes writes one
        dated Markdown note to the Output folder for the lawyer to bring back. Everything host-side is optional
        because the review runs on conversation text alone; no cross-session PERSIST or SESSION is asked
        of the host. No INVOKE (upstream is implicit too).
  my-lq-moment:
    group: companion
    upstream:
      levels:
        TOOLS: R
        IN: D
        OUT: R
        FS: D
        PERSIST: O
        EXEC: R
        BIN: D
        SESSION: R
        SKILLDIR: R
        SKILLDIR:asset: R
        INVOKE: R
      evidence:
        SKILLDIR:asset:
        - P7
      needs:
        python: '3.11'
        binaries_any:
        - rsvg-convert
        - magick
        - convert
        - inkscape
        - chromium
        - chromium-browser
        - google-chrome
      fallbacks:
        IN:
          text: 'If the host cannot supply real evidence (some hosts expose little), say so plainly: an
            automatic insufficient evidence outcome, ending in refusal, not in a lower bar.'
          ref: upstream/skills/companion/my-lq-moment/SKILL.md:69-71
        FS:
          text: 'If the cover template file is missing, the skill cannot produce a cover: say so and give
            the approved text.'
          ref: upstream/skills/companion/my-lq-moment/assets/README.md:6-7
        BIN:
          text: 'If no PNG: ask to re-run with elevated execution; only if that also fails, say so, hand
            over the SVG and the approved text, and give the one-line conversion.'
          ref: upstream/skills/companion/my-lq-moment/SKILL.md:187-195
    cowork:
      levels:
        TOOLS: R
        IN: D
        OUT: D
        FS: O
        SESSION: R
        HTML: D
        SKILLDIR:asset: D
      evidence:
        SKILLDIR:asset:
        - P7
      fallbacks:
        IN:
          text: 'Say which of those you can actually see here, and name anything on that list you cannot
            see rather than assuming it: what you cannot see is not evidence.'
          ref: dist/legalquants-companion-cowork/skills/my-lq-moment/SKILL.md:55-57
        OUT:
          text: 'The cover is the page this skill builds on the template, or the announced plain card, or
            not at all: never a placeholder, never a PNG claimed rather than produced.'
          ref: dist/legalquants-companion-cowork/skills/my-lq-moment/SKILL.md:290-292
        HTML:
          text: Offer the third form, one square slide through the built-in PowerPoint skill, if they would
            rather have that; give the one-line conversion to a square image.
          ref: dist/legalquants-companion-cowork/skills/my-lq-moment/SKILL.md:202-207
        SKILLDIR:
          text: If the packaged template does not come through into the page, build a plain styled card
            on a near-black ground and say in one line that the template image is not in it. If the file
            is missing, say so and give the approved text.
          ref: dist/legalquants-companion-cowork/skills/my-lq-moment/SKILL.md:199-203
        SKILLDIR:asset:
          text: If the packaged template does not come through into the page, build a plain styled card
            on a near-black ground and say in one line that the template image is not in it. If the file
            is missing, say so and give the approved text.
          ref: dist/legalquants-companion-cowork/skills/my-lq-moment/SKILL.md:199-203
      notes: 'render_cover.py and the SVG-to-PNG rasteriser are gone; the cover is now an HTML page written
        to the Output folder on top of the bundled cover-template.png and shown in the preview pane, with
        a plain-card and a PowerPoint-slide fallback, and the one kept line is handed over in the reply
        instead of saved through the store. SESSION stays R: the card still refuses (insufficient evidence)
        if the host cannot show current-session evidence. No INVOKE: built frontmatter lacks disable-model-invocation.'
  legaldesign:
    group: core
    upstream:
      levels:
        TOOLS: R
        MCP: O
        IN: R
        OUT: R
        FS: R
        PERSIST: O
        EXEC: D
        BIN: O
        NET: O
        VISION: D
        HTML: R
        SKILLDIR: D
        SKILLDIR:asset: D
      evidence:
        SKILLDIR:asset:
        - P7
      needs:
        python: '3.10'
      fallbacks:
        EXEC:
          text: Where script execution is unavailable, host-native tools must provide equivalent safe serialization,
            validation, and the finished shared runtime; do not claim unperformed checks.
          ref: upstream/skills/core/legaldesign/references/build.md:104
        VISION:
          text: Correct failures and rerun affected/dependent checks; disclose anything unavailable. Do
            not claim a browser check from code inspection. (Multi-viewport and interaction QA is reported
            as not done.)
          ref: upstream/skills/core/legaldesign/references/qa.md:3
        SKILLDIR:
          text: scaffold.py reads assets/, schemas/ and DESIGN.md relative to the skill folder and exhibit.py
            sits beside it; without them the same host-native-tools fallback as EXEC applies (equivalent
            serialization, validation and the shared runtime, no unperformed checks claimed).
          ref: upstream/skills/core/legaldesign/references/build.md:104
        SKILLDIR:asset:
          text: Host-native tools must provide the finished shared runtime; do not claim unperformed checks.
          ref: upstream/skills/core/legaldesign/SKILL.md:18
    cowork:
      levels:
        TOOLS: R
        MCP: O
        IN: R
        OUT: R
        VISION: D
        HTML: R
        SKILLDIR:asset: D
      evidence:
        SKILLDIR:asset:
        - P7
      fallbacks:
        VISION:
          text: You do not have a real browser at several window sizes. Do every check you can by reading
            the file and looking at the preview, and list the rest in the handoff as outstanding, by name.
          ref: dist/legalquants-litigation-cowork/skills/legaldesign/references/qa.md:7
        SKILLDIR:asset:
          text: Nothing checks that the finished page truly follows the structure of the packaged template
            or component the skill says it used, so a page that looks plausible but does not really follow
            that structure would read as correct.
          ref: 'skills/legaldesign/skill.yaml (KI-legaldesign-3: Whether a packaged template actually shaped
            the output is unverified)'
      notes: 'Removed scaffold.py/exhibit.py, the JSON schemas, blank templates and the cite-check adapter:
        the model now writes the spec and the single self-contained HTML itself and the preview pane renders
        it, so EXEC, BIN, NET and the SKILLDIR/HASH needs are gone; authentic source clips exist only if
        the lawyer supplies one (the exhibit sha256 fields were dropped from the contract). Packaged assets/*.html
        are filled examples the model only reads. Optional licensed service kept as a one-line mention (SKILL.md:48).'
  lq-start:
    group: core
    upstream:
      levels:
        TOOLS: R
        FS: R
        EXEC: R
        SKILLDIR: R
        INVOKE: R
      needs:
        python: '3.8'
      fallbacks: {}
    cowork:
      levels: {}
      fallbacks: {}
      notes: Replaced the live catalog.py scan (EXEC, FS over the host plugin tree, SKILLDIR sibling walk)
        with a static references/map.md that the model only reads, so no host capability beyond baseline
        chat and skill loading is needed. The built frontmatter has no disable-model-invocation, so INVOKE
        is dropped; the card says deliberate selection is the Sources picker.
  regulatory:
    group: core
    upstream:
      levels:
        TOOLS: D
        MCP: O
        IN: D
        OUT: O
        FS: D
        PERSIST: O
        EXEC: D
        NET: D
        SEARCH: D
        SUB: O
        SKILLDIR: D
      evidence:
        NET:
        - P18
      needs:
        python: '3.8'
      fallbacks:
        IN:
          text: 'For PDF source text, use this cascade: the host''s built-in document extraction or a separately
            available open-source extractor, then a firm-approved OCR/document service; feed the resulting
            text to extract_provisions.py. User-supplied official downloads may be checked with host tools
            but must retain origin and version evidence.'
          ref: upstream/skills/core/regulatory/SKILL.md:571
        FS:
          text: Without Python, network or file retention, perform the same checks with available host tools,
            or use the provisional route.
          ref: upstream/skills/core/regulatory/SKILL.md:612
        EXEC:
          text: Scripts are optional host capabilities. Without Python/network/file retention, perform the
            same checks using available host tools and record their coverage; if equivalent checks cannot
            be completed, use the provisional route. Never claim script verification when the scripts did
