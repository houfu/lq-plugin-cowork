            with host tools, else the provisional route).
          ref: upstream/skills/core/regulatory/SKILL.md:612
    cowork:
      levels:
        TOOLS: R
        IN: D
        OUT: R
        FS: O
        PERSIST: O
        SEARCH: O
        VISION: D
      fallbacks:
        IN:
          text: 'If they would rather not go and get it, say plainly what that costs: the answer comes back
