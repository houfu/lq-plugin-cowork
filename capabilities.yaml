          ref: upstream/skills/core/regulatory/SKILL.md:612
        NET:
          text: If the official source cannot be fetched or verified, the answer begins 'provisional and
            unverified' for the affected points.
          ref: upstream/skills/core/regulatory/SKILL.md:593
