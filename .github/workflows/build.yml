name: build

on:
  # Branches only: a tag push is a release, and release.yml handles it.
  push:
    branches: ["**"]
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install the build tooling
        run: uv sync --project tools

      - name: Tests
        run: make test

      - name: Formatting
        run: make fmt-check

      - name: Package the bundles
        run: make package

      - uses: actions/upload-artifact@v7
        with:
          name: cowork-packages
          path: |
            dist/*.zip
            dist/*.md
          if-no-files-found: error
