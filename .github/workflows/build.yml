name: build

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the build tooling
        run: uv sync --project tools

      - name: Tests
        run: make test

      - name: Package the bundles
        run: make package

      - uses: actions/upload-artifact@v4
        with:
          name: cowork-packages
          path: |
            dist/*.zip
            dist/*.md
          if-no-files-found: error
