name: diligence
upstream: transactional/diligence
bucket: red
anchored_to: fa5a6681dc3cc9a08fa9ed48a5fd213057edafa0

description: |
  Reviews a data room or contract portfolio against the lawyer's own issues list, a tranche at a time: inventories the room, maps contract families, compiles the checklist into a framework the lawyer confirms on a sample, then works agreement by agreement filling an Excel master register — one row per issue per agreement, with the finding, the words it rests on and where they sit — and delivers an HTML issue-and-agreement crosswalk showing what was covered and what was parked. Use when the user asks to "review this data room", "run diligence on these contracts", "check these agreements against our issues list", "what is missing or unreadable in this data room", or "build me an issue-by-agreement crosswalk". Do not use for testing a draft against a negotiation playbook (use the playbook-review skill), for reading a markup of one agreement (use the read-redline skill), for indexing an executed closing set (use the closing-bible skill), or for reviewing an incoming litigation production document by document.

exclude:
  - "scripts/**"
  - "*.schema.json"
  - "references/openai-codex-runtime.md"
  - "references/inventory-design.md"
  - "references/shared/inventory-design.md"
  - "references/shared/framework-schema.md"
  - "references/shared/review-ui.md"
  - "references/shared/schemas.md"

files: files

