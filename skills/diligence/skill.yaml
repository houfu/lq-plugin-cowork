notes: |
  Dropped scripts/ (19 top-level tools plus the 28-file shared runtime), every
  .schema.json contract, references/openai-codex-runtime.md (a runner contract
  for a runtime that is not here), references/inventory-design.md and its
  shared twin (a design note about what the scripts do, written for whoever
  maintains them), and the four references/shared/ duplicates the body never
  reads — the top-level schemas.md, framework-schema.md and review-ui.md are
  the ones diligence itself points at. Eight companions remain.

  Every SKILL.md section is replaced by an anchored overlay, so a heading that
  moves upstream fails the build rather than passing silently. The body's own
  portable fallback becomes the only path: sequential single-session
  processing, tranches the lawyer sizes, and an Excel master register that
  carries state between sessions and holds the coverage arithmetic as formulas
  the lawyer can open. Dependencies is deleted outright (Python, Poppler and
  LibreOffice have no meaning here). The coverage certification is retired: the
  claim-words rule is applied throughout, so no artifact describes itself as
  verified beyond this skill's own reading.

  references/shared/execution-modes.md is a full overlay rather than a patch:
  it was written as a choice between a bundled program and a fallback, and
  almost every paragraph named machinery that does not exist. Its replacement
  states the one path, the tranche rule, the 200 MB per-file and encrypted-file
  limits, the 50-file/500 MB limit on a handover archive, the documented
  scheduling machinery and its 25-prompt cap together with the reason no step
  depends on it, and — in the lawyer's own terms — which checks the original
  performed automatically and this run performs by reading. It is byte-identical
  to docreview's copy upstream and the same overlay ships in both cards.
  references/schemas.md is a full overlay because the artifacts changed kind:
  JSON files a program validated became sheets of the master register and named
  files in the Output folder, and the sha256 document identity became a
  four-field fingerprint re-read each session. references/review-ui.md is a
  full overlay because its last two sections were entirely the review-copy
  builder's contract — hashes, derivative bundles and a rendering cascade over
  local binaries — replaced by the quoted passage carried on the page itself,
  and by saying plainly that the lawyer does not get their own file back with
  marks on it.

  references/framework-schema.md keeps upstream's substance and is edited by
  anchored replacement: the compiler contract, the framework shape, the field
  meanings and the compiler's constraints survive nearly whole. Its
  findings.json section is replaced by a pointer to the register plus the four
  rules that belong beside the framework. The four per-pass contracts under
  references/shared/ are edited the same way, so the legal rules in them stay
  upstream's words; what changes is the orchestration language (fresh workers,
  an admitter, schema files) and the evidence-mode wording.

triggers:
  positive:
    - "Review this data room against our issues list and give me a crosswalk I can sort."
    - "Run diligence on the first fifty supplier agreements in the deal folder."
    - "What is missing, unreadable or duplicated in this data room?"
    - "Go through these agreements and tell me which ones restrict change of control, with the exact wording."
    - "Here is the register from last week and the next tranche of contracts; carry on."
  negative:
    - "Read this markup of the supply agreement and tell me what they changed. -> read-redline"
    - "Does this draft hold up against our negotiation playbook? -> playbook-review"
    - "Do the defined terms in this agreement hang together? -> definition-check"
    - "Go through their production and build me a privilege log queue. -> docreview"

cowork:
  tier: 2
  status: shipped
  differs: |
    The original ran a bundled program: it fixed each document's identity by
    hash, read many documents at once, and finished by computing a coverage
    figure you could rely on. None of that machinery exists here. This version
    reads the room one document at a time inside a single conversation, and
    works through it a tranche at a time — you choose how many documents a
    session takes, and you keep the workbook and attach it again next time,
    because that workbook is the only thing that remembers what has been done.
    The method is unchanged: the same framework compiled from your own
    checklist, the same two check-ins before the long run, the same rule that
    no finding goes into an artifact without the words it rests on, and the
    same second look at every finding. What changes is how much you can lean
    on it. A document's identity is a fingerprint read off the file — its
    name, its page count, its date, the first line of page one — rather than a
    hash, so a re-export that keeps all four looks the same to this skill. The
    coverage count is arithmetic in a workbook you can open and check rather
    than a check a program performed. And the second look is a second pass by
    the same reader, working from the finding and its quote alone, not a
    different reviewer. So the skill never tells you the room has been covered
    or that the result carries any warrant beyond its own careful reading; it
    tells you what it read, what it could not read, and where the tranche
    stopped. It says that at the start, not at the end.
  known_issues:
    - id: KI-diligence-1
      title: "A scanned page may be read as though it were text"
      detail: >-
        The skill is told to try every document, park whatever did not open,
        and list the parked ones with a reason, which is visible when it works.
        What is not settled is whether a page that is an image of text is
        recognised as one. If it is not, the reply may describe a page that was
        never actually read, and a blank or unreadable signature block can come
        back as a finding. Read the parked list on every delivery, and treat
        any finding marked as taken from an image as needing your own eyes on
        the page.
      failure: silent
      probe: P4
    - id: KI-diligence-2
      title: "The coverage count is arithmetic this skill did itself"
      detail: >-
        Upstream a program checked that every issue had exactly one result for
        every reviewable agreement. Here the register's Counts sheet holds
        units, issues, expected rows, filled rows and parked rows as formulas,
        and the skill states the row count it read in and the row count it
        wrote out. That makes the arithmetic checkable in about ten seconds,
        which is the point — but it is the skill's own arithmetic, and a
        workbook that came back with a formula flattened to a number or with
        rows dropped would otherwise look like any other workbook. Open the
        Counts sheet; compare the two stated row counts.
      failure: silent
      probe: P9
    - id: KI-diligence-3
      title: "The second look is a second pass, not an independent reviewer"
      detail: >-
        Upstream the checking pass ran in a separate context that had never
        seen the first pass. Here it is the same reader, working from the
        finding, its quote and the framework item without revisiting the
        reasoning that produced it. That still catches a quote that is not
        there and a characterization the words do not support; it catches a
        shared blind spot much less well. The register records it as a second
        pass and the skill is forbidden to call it independent review.
      failure: silent
    - id: KI-diligence-4
      title: "A swapped document is caught by four fields, not by a hash"
      detail: >-
        At the start of every session the skill re-reads each document's
        filename, page count, date and first line of page one and compares them
        with the register, reporting any mismatch before doing anything else.
        A swapped or re-exported file is normally caught and named. A change
        that leaves all four fields identical is not.
      failure: loud
    - id: KI-diligence-5
      title: "Without the register attached, the next session starts blind"
      detail: >-
        The register is the only state that crosses sessions. When it is not
        attached the skill says so in its first reply, names the file it
        expected, and says which tranches are on the record and which are not;
        it then continues on the reduced scope it can actually see rather than
        pretending to know the rest. Keep the workbook where you can find it.
      failure: loud
      probe: P2
  workarounds:
    - instead_of: "a bundled program hashes every file and binds the review copies to those hashes"
      cowork: "the register records a fingerprint per document — filename, page count, date, first line of page one — re-read and compared at the start of every session, with any mismatch named before anything else happens"
    - instead_of: "one fresh worker per document, many documents read at once"
      cowork: "one document at a time in the same conversation, same fields, same rule that every field carries the exact words it came from"
    - instead_of: "a working directory on disk holds the run's state between passes"
      cowork: "an Excel master register holds it, and the lawyer attaches it at the start of the next session"
    - instead_of: "a bundled program computes the issue-by-agreement coverage count"
