name: closing-bible
upstream: transactional/closing-bible
bucket: red
anchored_to: fa5a6681dc3cc9a08fa9ed48a5fd213057edafa0

description: |
  Reads a signed closing folder and hands back three things: an index the lawyer
  confirms, an exceptions list, and an Excel status register with one row per
  expected item, its status, the version selected as final, the qualification on
  anything not ready, and a count row they can re-add themselves. It is a
  reading of the documents supplied, not a balanced audit, and it never says a
  closing set is whole. Use when the user asks to "index this closing folder",
  "what is missing from the completion bible", "which version of each document
  is final", "reconcile the closing set against our checklist", or "list the
  exceptions before we bind the bible". Do not use for preparing or chasing
  signature pages (use the sigpack skill), for what still has to happen before
  completion (use the closing-checklist skill), or for a data room that has not
  closed (use the diligence skill). It does not assemble a combined bible PDF,
  does not fingerprint documents, and never decides that completion has
  occurred.

frontmatter:
  compatibility: null
  metadata: null

exclude:
  - "scripts/**"
  - "schemas/**"
  - "references/*.schema.json"
  - "references/assembly-rules.md"
  - "references/sigpack-ledger-consumption.md"

files: files

