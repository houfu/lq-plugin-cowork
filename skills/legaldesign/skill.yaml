description: |
  Turns legal work that is already done into one polished, editable,
  evidence-grounded HTML page - a complete one-pager or a slide brief with a
  clickable overview - that opens in the preview pane and can be handed to a
  client, a board or a colleague. Use when the user asks to "turn this advice
  into a one-pager", "make a visual summary of these findings", "build a slide
  brief explaining this deal structure", "explain this to the board", "produce
  a client-ready explainer from this memo", "make me a reusable template of
  that page", or "set up our firm's colours for these". Do not use for the
  underlying legal analysis, for a presentation deck (use the PowerPoint
  skill), for a formatted report or letter (use the Word skill), or for a data
  workbook (use the Excel skill). Do not use to write the substance of a
  status report, memo or advice; this skill lays out content that already
  exists.
