    When local Python and a writable workspace are available, run from the skill directory:

    ```text
    python3 scripts/scaffold.py init --form one-page --spec-output <workspace>/artifact.skeleton.json
    python3 scripts/scaffold.py components
    python3 scripts/scaffold.py compose --plan <workspace>/artifact.plan.json --spec-output <workspace>/artifact.spec.json --output <workspace>/artifact.html --artifact-id <stable-artifact-id>
    python3 scripts/scaffold.py validate --spec <workspace>/artifact.spec.json
    ```

    Use `--form slide-brief` for the other form. `init` does not choose the composition or produce a finished client file. Fill the plan, then `compose` validates and writes the canonical spec and self-contained HTML; it refuses existing output paths and leaves neither new output after failed paired writes. Keep a stable artifact ID for recovery. `components --markdown` exposes supported IDs/parameter slots; do not guess components, inject raw SVG, or silently substitute an inadequate generic figure.
  to: |-
    Build it yourself, in this order, and do not skip a step because the next one looks close:

    1. Write the empty skeleton for the chosen `form` - the brief, the required overview object and the section shells - before any matter text goes in.
    2. Fill the plan: claims, units, evidence and layout, each field against its contract in the table above.
    3. Compose one self-contained HTML file carrying the shared runtime, the composition and the inert state block. Keep a stable artifact ID in it so a later edit can find its way back.
    4. Check the finished specification and file against this contract before delivery, and write the checks you actually ran into the handoff.

    Read the component registry in [components.json](components.json) for supported component IDs and their parameter slots. Do not guess a component, inject raw SVG, or silently substitute an inadequate generic figure. Write the file once, under a new name; never overwrite an input or an earlier artifact.
  expect: 1
