notes: |
  Dropped the two builders, the JSON schemas, the blank template assets (which
  duplicate the six packaged examples) and the cite-check handoff adapter, whose
  neighbouring skill is not in every bundle. The body now says plainly that
  nothing is executed: the model writes the specification and the single
  self-contained HTML file itself, and the preview pane is the renderer, so the
  build reference's four script commands become an ordered authoring procedure
  and the schema check becomes a read of the field contract and the component
  registry. Evidence capture loses the clip tool: an authentic image now exists
  only where the lawyer supplies one, and the exact-excerpt path is the default.
  QA keeps every check and gains an explicit instruction to name the browser and
  device checks it cannot run rather than passing over them. The design
  authority, component grammar, method, copy and the six example pages are
  untouched.
