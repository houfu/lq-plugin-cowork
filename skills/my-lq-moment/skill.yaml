name: my-lq-moment
upstream: companion/my-lq-moment
bucket: red
anchored_to: fa5a6681dc3cc9a08fa9ed48a5fd213057edafa0
description: |
  Judges one piece of work in this session against a fixed bar and, only when
  it clears it, writes up what the lawyer did, what it took and what it
  changed — with a post in their own voice and a cover card that opens in the
  preview pane. Use when the user asks "was that an LQ Moment", "was this
  session the good kind, write it up", "did I just do something good, or am I
  flattering myself", "share this win", or "is this worth posting about".
  Borderline means not earned, and a session it cannot see enough of is
  refused rather than marked down. Do not use for a reading of the lawyer
  themselves — "assess me", "what's my archetype", "where am I with AI" (use
  the lq-mirror skill) — or for going back over a piece of work to find the
  one thing to change next time (use the lq-reflect skill). The cover here is
  part of this write-up and nothing else; do not use this skill to lay out a
  document, build a one-pager, or make a polished page for the preview pane.
exclude:
- scripts/**
sections:
- match: '## First run? One marker, once ever'
  delete: true
- match: '## The ending — where moments compound'
  file: sections/ending.md
replace:
# The title anchor is the post-transform text: upstream writes
# '# /my-lq-moment — ...' and the mechanical skill-token rewrite drops the
# slash before card replacements run (CONTRACT section 5, steps 5 and 6).
# The lq-mirror card anchors its title the same way.
- from: |
    # my-lq-moment — what should I celebrate?
  to: |
    # What should I celebrate?
  expect: 1
- from: |
    Say what that covers — this session's conversation, the tool and skill
    events, the workspace artifacts (files edited or created, tests and
    validation results) — and wait for a yes.
  to: |
    Say what that covers — this session's conversation, the tool and skill
    events, the workspace artifacts (files edited or created, tests and
    validation results) — and wait for a yes. Then say which of those you can
    actually see here, and name anything on that list you cannot see rather
    than assuming it: what you cannot see is not evidence.
  expect: 1
- from: |-
    Scope is the **current session only**: no history, no transcripts of other
    sessions, no `~/.lq/`, no profile or playbook reads.
  to: |-
    Scope is the **current session only**: no history, no other sessions, no
    stored profile, and no playbook or preference files.
  expect: 1
- from: |2
       Then the cover, built to `references/cover.md`: the skill's own template
       (`assets/cover-template.png`) is the foundation, with two short sentences
       from the receipt set over it as the hero, and nothing else added. The
       cover is rendered by the skill's own script, never by an image model:
       draft the two sentences short (eight to ten words each; the script
       refuses more than twelve), get the lawyer's yes on them, then run
       `scripts/render_cover.py --before "…" --after "…" --out-dir outputs`
       (`../my-lq-moment/scripts/` resolves the same way in a packaged plugin).
       It writes `my-lq-moment-cover.svg` and, where the host has any SVG
       renderer, `my-lq-moment-cover.png`, and prints where they are. If it
       reports no PNG, read its `attempts` and `message`: on a sandboxed host
       the renderers may be present but blocked, so ask for permission to re-run
       the same command with the host's elevated execution capability. Only
       if that also fails, say so, hand over the SVG and the approved text, and
       give the one-line conversion (open the SVG in a browser or Preview and
       export a 1200 by 1200 PNG). Do not draw anything yourself, ask an image
       model, or claim a PNG exists.
       If it refuses a sentence as too long, shorten it and offer the shorter
       version; never ask the lawyer to fit or format text. Show everything
       verbatim; they edit the wording freely within the briefs and you re-run
