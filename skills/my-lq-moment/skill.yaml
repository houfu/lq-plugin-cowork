       Write it to the session's Output folder as `my-lq-moment-cover.html`,
       say where it is, and show it in the preview pane.

       Say which form of the cover you produced, every time, and never claim a
       form you did not produce. If the packaged template does not come
       through into the page, do not pretend it did: build the same two
       sentences as a plain styled card on a near-black ground, say in one
