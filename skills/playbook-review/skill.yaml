name: playbook-review
upstream: transactional/playbook-review
bucket: amber
anchored_to: fa5a6681dc3cc9a08fa9ed48a5fd213057edafa0
description: |
  Reviews a counterparty contract, an outbound draft or a revised contract
  package against an approved contract playbook and returns a clause-anchored
  issues list: exact source wording, proposed wording with visible markup,
  internal risk guidance, a comment ready to send across the table, and a
  coverage account of every rule and document. Use when the user asks to
  "review this contract against our playbook", "mark this MSA up against our
  standard positions", "check this draft before it goes out", "what's
  off-market in this agreement", "re-review the revised draft they sent back",
  or "give me an issues matrix for this contract". Do not use to build or
  update the playbook itself (use the playbook-builder skill), and do not
  expect a tracked-changes redline of the source document. Do not use to track
  deliverables and conditions to closing (use the closing-checklist skill).
exclude:
- scripts/**
- schemas/**
- references/playbook-engine-contract.md
files: files
replace:
- from: The deterministic script hashes the PDF and extracts native text if a text layer or reader is available. If native text cannot be read deterministically, it marks the document for host reading. The host then records the page count, applies native text where available, and renders/inspects only scanned or uncertain pages, adding source elements with stable IDs. If that capability is not available, keep the document pending and do not claim complete coverage.
  to: Read the PDF's text layer where it has one. Record the page count, apply native text where it is available, and look at only the scanned or uncertain pages, giving each source passage a stable identifier. Where a page cannot be read at all, keep it pending and do not claim complete coverage.
  expect: 1
  files:
  - references/pdf-intake.md
notes: |
  Full-file overlay: more than half the upstream body was script mechanics.
  Seventeen script invocations, the orchestrator, the JSON artifact set
  (issues-list.json, effective-stance.json, term-map.json, source-manifest.json,
  the two receipts and the HTML render), the playbook discovery and registry
  picker and the script-produced Word exports are all gone. The legal method is
  kept whole: the Gate 1 lens decision in the lawyer's own quoted words, the
  five defined-term mapping outcomes, the nine issue statuses with their
  commercial labels, substantial equivalence, the two-direction sweep, the
  dual-track internal and external commentary, drafting provenance, the
  structural warnings, the three coverage equations, and the internal and
  external Word cuts. The issues matrix is now a table in the reply plus
  issues-list.md, and a Word document through the built-in Word skill on request,
  carrying the columns the review issue shape defined (clause reference, playbook
  issue and topic, status, risk, source wording, proposed wording with markup,
  drafting provenance, internal guidance, external comment, lawyer decision).
  Verification by hash and validator becomes verification by reading and quoting,
  stated as such. The playbook is found by file name, not by a registry.
  references/playbook-engine-contract.md is replaced by references/playbook-format.md,
  shared byte for byte with the playbook-builder skill.

cowork:
  tier: 2
  status: shipped
  differs: |
    The original ran the review through seventeen script steps: a program
    checked every quote against the source by hash, produced a set of
    machine-checked files, and exported an internal and an external Word
    version automatically. Here the model reads and quotes the contract
    itself and states that plainly as how the wording was checked, and it
    delivers the same clause-by-clause issues list in the reply, as a file,
    and as a Word document through the built-in Word skill when you want
    one. What you get is an issues list showing the wording to use instead,
    not your original document handed back with visible tracked changes on
    it. And because no script checks the exported table against the issues
    list, the skill states the number of rows it produced, so a row that
    went missing on the way to Word would be noticed rather than simply
    absent.
  known_issues:
    - id: KI-playbook-review-1
      title: "An issues list, not a tracked-changes redline of your document"
      detail: >-
        The deliverable is a clause-anchored issues list showing the source
        wording, the proposed wording and the reasoning behind it, never
        your own document handed back with the changes marked on it. If you
        want a marked-up copy, take the proposed wording from the issues
        list and apply it as tracked changes yourself, or ask for that
        explicitly. Whether Cowork can produce a Word file with real tracked
        changes in it is not yet settled.
      failure: loud
      probe: P10
    - id: KI-playbook-review-2
      title: "The Word matrix is built by the Word skill, not checked by a script"
      detail: >-
        The internal and external issue matrices used to be produced and
        checked by a script that could not drop a row without failing. Here
        the built-in Word skill builds the table from the same issue data,
        and nothing checks afterwards that every row survived. The
        mitigation is that the skill states the row count it produced
        alongside the matrix, so check that count against the issues list
        before you rely on it.
      failure: silent
  workarounds:
    - instead_of: "seventeen script steps verify every quote by hash and a validator before the issues list is treated as complete"
      cowork: "the model reads and quotes the contract itself and states that as how the wording was checked"
    - instead_of: "a script exports the internal and external Word cuts automatically from the validated issue set"
      cowork: "the issues matrix is a table in the reply plus a file, and a Word document through the built-in Word skill on request, stating the row count produced"
    - instead_of: "a registry and discovery picker find the approved playbook automatically"
      cowork: "the playbook is found by its file name, in the folder you point to"

triggers:
  positive:
  - Review this MSA the supplier sent against our playbook.
  - Check this draft services agreement against our standard positions before it goes out.
  - What's off-market in this contract? Here's our playbook.
  - They've sent back a revised draft - re-review it against the same playbook and tell me what moved.
  negative:
  - Build a playbook from these three precedents. -> playbook-builder
  - Apply these changes as tracked changes in the Word file. -> Word
  - Draft the closing checklist for this transaction. -> closing-checklist
  - Explain the deal risks to the board in a one-page visual. -> legaldesign
