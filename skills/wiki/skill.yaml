- from: '- **Document-relative body links.** §6.1 recommends the `/`-rooted form; note bodies use document-relative links (`../traps/silent-sub-processor-lists.md`) instead, because those resolve in editors, in Obsidian and in web views of the wiki, while `/`-rooted links do not. Frontmatter paths stay bundle-root-relative (§6.2).'
  to: '- **Document-relative body links.** §6.1 recommends the `/`-rooted form; note bodies use document-relative links instead — stepping out of the note''s own folder and back down into the target''s — because those resolve in editors, in Obsidian and in web views of the wiki, while `/`-rooted links do not. Frontmatter paths stay bundle-root-relative (§6.2).'
