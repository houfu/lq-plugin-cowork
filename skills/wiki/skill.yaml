notes: |
  Dropped the bundled wiki tooling and the automation reference. The wiki root is
  a folder the lawyer names in their own file store, suggested as
  Documents/Cowork/wiki. references/wiki_schema.md is replaced with a Cowork
  version: one design, stated once, with no machine sidecar at all - no hash
  chain, no lock, no versions directory, no dry runs or rollback - because none of
  those can be maintained without code. In their place, log.md is the record, a
  note is withdrawn rather than deleted (Cowork cannot delete files), and a
  confidentiality leak is reported for the lawyer to clear rather than described
  as remediated. The automation section is replaced by a plain statement that
  there is none. Browse builds a Markdown or single-file HTML index the preview
  pane renders. Stored-wording lookup reads the note directly. Gate prompts, note
  types, the source policy and the OKF profile are otherwise untouched.
triggers:
  positive:
  - Add this ruling on limitation periods to my wiki.
  - Save the reusable lessons from this conversation to my wiki.
  - What does my wiki say about subprocessor flow-down obligations?
  - Browse my wiki - show me everything I have on data protection.
  negative:
  - Find me every email and document about the Cedar acquisition. -> Enterprise Search
  - Draft a client-ready one-pager explaining this advice. -> legaldesign
  - Write up the time entries for the research I did today. -> timenarratives
  - Which skill should I use to get started here? -> lq-start
