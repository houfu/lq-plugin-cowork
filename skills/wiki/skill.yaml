name: wiki
upstream: core/wiki
bucket: amber
anchored_to: fa5a6681dc3cc9a08fa9ed48a5fd213057edafa0
description: |
  Keeps a lawyer's personal legal wiki as linked, source-grounded Markdown
  notes in a folder they own, and answers from it: reusable law and method
  only, never matter facts. Use when the user asks to "add this to my wiki",
  "save the reusable lessons from this conversation", "what does my wiki say
  about limitation periods", "show me the approved wording I stored for this",
  "compare this draft against my wiki and tell me what I'm missing", "browse
  my wiki", or "check my wiki for broken links and stale notes". Do not use
  for matter files, client facts or case documents, for searching documents
  and mail across the organisation (use the Enterprise Search skill), or for
  research into outside material (use the Deep Research skill). Do not use for
  matter chronologies or work product.
exclude:
- scripts/**
- references/automation.md
sections:
- match: '## Start by finding the wiki'
  file: sections/finding-the-wiki.md
- match: '## Automation is an optional enhancement'
  file: sections/automation.md
replace:
- from: |-
    For **browse, open, show, or explore the wiki**, deliver an inline reader in
    the same turn. Prefer the host's built-in visualization skill when available;
    read and follow its current rendering, design and verification instructions.
    Use another native artifact capability if needed, or Markdown links/a table
    when visual rendering is unavailable. Do not merely offer a reader or return
    only a file path. Opening a named note shows that note; **map relationships**
    requests a relationship view grounded in the wiki's actual links.
  to: |-
    For **browse, open, show, or explore the wiki**, deliver a reader in the same
    turn. Build it as one index file the preview pane renders: Markdown for a
    plain collection, or a single self-contained HTML page when search and
    filters would genuinely help. Save it in the wiki folder as the Wiki Home or
    alongside it, and show it. Do not merely offer a reader or return only a file
    name. Opening a named note shows that note; **map relationships** requests a
    relationship view grounded in the wiki's actual links.
  expect: 1
- from: |-
    Browse is read-only. Take the short path: resolve the wiki, obtain the eligible
    payload once, compose the native reader, verify it, and deliver. When scripts
    are available, use the browse helper; otherwise read the eligible Markdown
    notes directly. Do not load mutation references or re-read source documents
    unless needed to resolve a specific issue. Follow the visualization skill's
    verification requirements; launch a separate preview only when those require
    it or a concrete layout/runtime uncertainty warrants it. A standalone website
    or export is a separate user request.
  to: |-
    Browse is read-only. Take the short path: settle the wiki folder, read the
    eligible notes once, compose the index, check it, and deliver. Do not load
    mutation references or re-read source documents unless needed to resolve a
    specific issue. Check the delivered index yourself before handing it over:
    every link resolves inside the wiki folder, and no note is missing. A
    standalone website or export is a separate user request.
  expect: 1
- from: |-
    Build the browser from the **complete eligible wiki by default**. Use
    `wiki.py browse --json` without `--topic` or `--note`. Narrow the dataset only
  to: |-
    Build the browser from the **complete eligible wiki by default**: read every
    eligible note in the wiki folder. Narrow the dataset only
  expect: 1
- from: |-
    delivering, reconcile the reader's note IDs and count against the browse
    payload and check that complete bodies and sources remain accessible. State
  to: |-
    delivering, reconcile the index's notes and count against the notes you
    actually read, and check that complete bodies and sources remain
    accessible. State
  expect: 1
- from: |-
    capabilities; let the visualization skill choose the smallest fitting layout
    and native controls. Do not add dashboards or custom application chrome by
    default.
  to: |-
    capabilities; choose the smallest layout that carries them. Do not add
    dashboards or custom application chrome by default.
  expect: 1
- from: |-
    For Ask, the optional stdlib helper returns exact text and source/approval data:

    ```text
    python3 scripts/wiki_wording.py --wiki /wiki/root --note topic/positions/note.md --block example-option
    python3 scripts/wiki_wording.py --wiki /wiki/root --note topic/positions/note.md --block example-option --check /workspace/answer-block.txt
    ```

    The helper is a private Ask reader, not a shareable export. It excludes pending,
    unreviewed, non-stable or stale notes and unapproved/changed blocks. The check
    compares the answer block byte-for-byte; no punctuation or whitespace folding.
    Without scripts, read the delimited block and compare it directly. If exactness
    cannot be verified, say so. Never reconstruct missing wording. Display the
  to: |-
    For Ask, read the delimited block out of the note itself and quote it exactly.

    Reading a stored block is private, not a shareable export. Exclude pending,
    unreviewed, non-stable or stale notes and unapproved or changed blocks. Compare
    the block you are about to quote against the note character by character; no
    punctuation or whitespace folding. If exactness cannot be verified, say so.
    Never reconstruct missing wording. Display the
  expect: 1
  files:
  - references/positions.md
- from: |-
    Manual use is complete. If you want automation later, ask for “Wiki automation
    settings,” choose Selected projects or All projects, and turn on automatic
    retrieval. Saving new knowledge remains a deliberate request in a normal task.
  to: |-
    Manual use is the whole product. Nothing runs on its own: saving new knowledge
    and bringing existing notes into your work are both deliberate requests.
  expect: 1
  files:
  - references/getting-started.md
- from: |-
    Build a persistent, browsable legal wiki the lawyer owns. The wiki is ordinary
    Markdown plus a small `.wiki/` sidecar: readable in any editor and useful
    without a particular host, chat, or visual view.
  to: |-
    Build a persistent, browsable legal wiki the lawyer owns. The wiki is ordinary
    Markdown in a folder they name: readable in any editor and useful without this
    skill, this chat or any visual view.
  expect: 1
- from: '- **No `.md` under the machine sidecar.** Everything under `wiki/.wiki/` is machine state — history, prior versions, pending suggestions, the vocabulary file — and no `.md` file may exist there, so §11''s frontmatter rule can never be triggered by a sidecar file.'
  to: |-
    - **No machine sidecar.** There is no hidden state directory: every file in the
      bundle is a Markdown note, an index, the log or a pending proposal, so §11's
      frontmatter rule applies to everything in it without exception.
  files:
