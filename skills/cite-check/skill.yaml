  - from: "The model makes the legal call. Small deterministic code only checks that the result has usable evidence fields and that a cited source belongs to the files supplied for this run. It then assigns the display color: incomplete evidence is amber, while the model's substantive red or yellow finding remains intact. This check prevents missing or invalid evidence from appearing green; it does not decide whether a proposition fairly states the law."
    to: "You make the legal call, and you assign the display color by a fixed rule applied to your own result. A citation whose `source_excerpt` or `source_locator` is missing, or whose `matched_source_id` is not one of the authority files supplied for this run, is amber — claimed but unverified — and never green, however confident the reading felt. A substantive red or yellow finding you reached on the evidence stays as you made it. Apply that color rule to every row before filling the report; it keeps missing or out-of-universe evidence from appearing green, and it does not decide whether a proposition fairly states the law."
