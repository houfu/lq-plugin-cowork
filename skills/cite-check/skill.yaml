name: cite-check
upstream: litigation/cite-check
bucket: amber
anchored_to: fa5a6681dc3cc9a08fa9ed48a5fd213057edafa0

description: |
  Checks the citations in a brief, motion or memorandum against the authorities supplied for the run, one prepared paragraph, footnote and table cell at a time: resolves short forms, tests quotations, pincites and whether each source actually supports the proposition it is cited for, flags citations that cannot be found anywhere and may be fabricated, and produces a color-coded HTML report to open in the preview pane. Use when the user asks to "cite-check this brief before I file it", "verify the quotations in this motion against the cases", "do these cases actually say what the brief says they say", "are any of these citations made up", "check the pincites in this memo", or "review the authorities in this draft opinion letter". Do not use for testing an argument's internal logic, dates and figures (use the pressuretest skill), for drafting or revising the document itself (use the writing skill), or for whether an authority is still good law, which this skill does not determine.

exclude:
  - "scripts/**"
  - "schemas/**"
  - "references/openai-codex-runtime.md"
  - "references/parent-fanout.md"

