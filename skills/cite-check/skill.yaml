    file: sections/orchestration.md
  - match: "## Method"
    file: sections/method.md

notes: |
  Dropped scripts/ and schemas/ (the packaged runner and its JSON contracts), references/openai-codex-runtime.md (a runner contract for a runtime Cowork does not have) and references/parent-fanout.md (the same fan-out procedure again, expressed entirely in script invocations and run directories). The body's own one-unit-at-a-time path is now the only path: the Step 1, Orchestration and Method sections are rewritten so the model works through prepared units itself, and the normalized-evidence check that the packaged validator performed is stated as a rule the model applies before filling the report. The report is still rendered from the packaged assets/report-template.html, saved as an HTML file for the preview pane. Public case search is rewritten to name Deep Research and Enterprise Search and to spell out that finding a case proves existence only, never the quotation, pincite or proposition. references/lawyer-workflow.md carries the same four edits so the lawyer-facing walkthrough matches.

triggers:
  positive:
    - "Cite-check this summary judgment brief against the cases in the folder before I file it on Friday."
    - "Verify every quotation in this motion against the opinions I gave you and flag anything overstated."
    - "Are any of the citations in this draft made up? I did not write all of it."
    - "Check the pincites and short-form chains in this appellate brief."
  negative:
    - "Pressure-test whether this argument actually holds together on the documents. -> pressuretest"
    - "Is Kowalski v. Reese still good law in the Ninth Circuit? -> none"
    - "Draft the argument section of this brief. -> writing"
    - "Find me cases supporting a stay pending arbitration. -> Deep Research"
