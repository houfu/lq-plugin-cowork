  - from: "For United States case law, search CourtListener or another available public source using citation metadata only. For another jurisdiction, use an available public source from the [jurisdiction-specific authority sources](references/getting-authorities.md#jurisdiction-specific-authority-sources). Do not upload the client brief. Report one simple outcome: the environment could not search; the search did not find the case and it may be hallucinated; or the case was found but was not supplied for substantive checking."
