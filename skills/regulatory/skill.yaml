notes: |
  Dropped scripts/ — the eight programs that fetched the publisher's document,
  refused an off-host redirect, hashed it, matched version markers, split and
  indexed the provisions, re-located every quotation, diffed two runs and audited
  a check note's coverage table. The premise changes and nothing else does: the
  lawyer goes to the publisher, downloads the document and puts it in the Input
  folder, and step 3 is rewritten around a provenance block — publisher, address,
  date retrieved, and the lawyer's own statement that they took it from there —
  which travels with every deliverable beside the source filename. That block is
  what replaces the retrieval record and the hash, and step 3 says so in terms,
  including what is given up. Steps 4, 5 and 7 become checks the model performs
  and records, each producing something the lawyer reads, and each one says once
  that it is self-performed; the Scripts reference section becomes a table of what
  each program did and what stands in its place. The delivery gate is rewritten
  around upstream's own provisional route, which is now the ordinary failure:
  no provenance block, no definitive report. refresh asks the lawyer to attach the
  earlier note and its provision list and to download today's text, writes this
  run beside the earlier one rather than over it, and names what it looked for and
  did not find before doing anything else; its delivery discipline — the four
  failing openings, quote-the-amendment, replaced and retitled, the blocked
  comparison — moves verbatim into the new references/refresh-rules.md, which
  keeps the body inside the word budget. What this produces moves the run folder
  to the Output folder and says nothing is deleted afterwards. The one rule, the
  second rule, the construction rubric, the routing table, steps 1 and 6, research
  and compare are untouched: the central rule that nothing is quoted that did not
  come from the publisher's own document is the whole skill and survives intact.
  Companions: the seven jurisdiction registries each gain a dated "as at" line
  saying they are a pointer and never evidence, and forbidding the words current,
  the latest and still good; their script-shaped retrieval traps are rewritten for
  a lawyer downloading in a browser; discovery.md's "coverage receipt" becomes a
  "coverage record" throughout and its audit step becomes a re-read; run-format.md
  keeps every quoting rule and loses the run folder, the manifest and the hash
  machinery; version-check.md's provenance line names the file in the Input folder
  instead of a hash. New companion: references/refresh-rules.md (12 companions in
  total, inside the cap). LQC-W010 is suppressed over references/jurisdictions/,
  where the publisher addresses are upstream-authored and are the point of the
  registry, and LQC-W004 over the same folder, where the `.../enacted` forms in
  the entries' `preferred_url_form` strings are abbreviated addresses and not
  paths out of the skill. LQC-W006 is suppressed on the body, and the number
  is worth stating plainly: upstream is 5,685 words and the built body lands near
  5,200. The script machinery is gone and the refresh delivery rules moved out,
  but the sections that replaced them run to the same length, because they are
  legal method rather than mechanics — the one rule, the four findings kept apart,
  the version discipline, the construction rubric's entry points and four
  workflows. If the budget has to be met, the next lever is the check workflow's
  fact-gathering prose (a sector is not an activity, a role is not an identity,
  the five facts), which belongs in references/discovery.md beside its own
  section 1; that is another 400 words and close to the last cut available before
  method starts going.

