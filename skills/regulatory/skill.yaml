  # --- the four findings move out of the body and into version-check.md -----
  - from: "## The vocabulary trap"
    to: |-
      ## Four findings, kept apart

      Before anything is quoted, establish and state each of these separately:
      **publisher identity** — whose site the document came from; **publication
      authority** — what this copy *is*, the authentic text or a convenience copy;
      **language** — authentic, second authentic, or translation; and **version**.
      They are independent findings, and collapsing any two of them is how an
      unofficial copy comes to be labelled official.

      The trap is site furniture. A page's language notice — *"the English language
      version is always the official and authoritative version of this website"* — is
      a translation-widget disclaimer about the website. It establishes nothing about
      the legal authority of the statute printed on it, and the same publisher may
      say in its own user guide that the text is unofficial. Both were true of
      Illinois at once. So quote the publisher's statement about the **statutory
      text**, not a notice that happens to contain the word "official"; if the
      publisher makes no such statement, that absence is the finding, and it gets
      written down.

      A government-hosted convenience copy that disclaims its own authenticity can
      still carry a qualified answer — that is the default, and a firm may set a
      stricter one. What it can never do is carry a silent one. Put the publisher's
      disclaimer in the note, in its own words, and name the authentic publication
      that would settle the point.

      ## The vocabulary trap
    files: ["references/version-check.md"]
    expect: 1
