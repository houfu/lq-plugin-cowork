cowork:
  tier: 1
  status: shipped
  differs: |
    The original went to the regulator's own website itself, refused anything
    that redirected away from it, and kept a fingerprint of the document so it
    could show that the text it quoted at the end was the same text it had read
    at the start. None of that is available here, so the lawyer does the
    retrieval: the skill names the instrument and the publisher, the lawyer
    downloads that document and drops it in the Input folder, and the skill works
    from it. The quoting rule that makes this skill worth having is untouched -
    nothing is quoted that did not come from the publisher's own document, not
    from a search result, a tracker, a law firm note or the model's memory. What
    changes is who stands behind the provenance. In place of the retrieval record
    the note carries a short block naming the publisher, the address, the date
    and the lawyer's own statement that they took it from there, and that block
    travels with every deliverable beside the source filename. If the lawyer
    skips the download, or cannot say where a file came from, the note comes back
    headed "provisional and unverified" with the unsupported points named, which
    is the skill working correctly rather than failing. The version check, the
    provision list and the pass that finds every quotation again in the file are
    now done by the same reader who wrote the note rather than by a program, and
    the note says so; what makes them worth something is that the source is
    sitting in the lawyer's own Input folder and any one of them can be repeated
    in ten seconds.
  known_issues:
    - id: KI-regulatory-1
      title: "Provenance is attested by the lawyer, not established by the skill"
      detail: >-
        The skill cannot fetch the document, refuse an address that redirects off
        the publisher's host, or fingerprint what it read. It relies on the
        lawyer's statement of where the file came from. A file downloaded from a
        mirror, a subscription service or an aggregator will read exactly like the
        publisher's own, and the provenance block will say whatever the lawyer
        says. Ask for the address, put it in the block, and treat an incomplete
        block as the trigger for the provisional heading rather than as a
        formality.
      failure: loud
    - id: KI-regulatory-2
      title: "A scanned or image-only publisher PDF stops the run"
      detail: >-
        Some publishers serve older instruments as scans with no text layer.
        Nothing in Cowork is documented to read one, so the skill says the text
        could not be read and asks whether the publisher offers an HTML or
        text-layer version of the same document. It must not describe pages it has
        not read. If a run ever reports provisions out of a document the lawyer can
        see is a scan, stop and report it.
      failure: loud
      probe: P4
    - id: KI-regulatory-3
      title: "The quotation pass is run by the same reader who wrote the note"
      detail: >-
        Upstream had a program find every quotation again in the source without a
        model in the loop. Here the model does it and records the provision label
        and locator for each quote. A paraphrase reads exactly as well as the
        provision, so a missed one leaves no mark on the note. The mitigation is
        that the lawyer can repeat the check: the file is in their own Input
        folder, every quote carries its provision label, and one takes ten seconds.
        The note says the pass was self-performed and names the file to open.
      failure: silent
    - id: KI-regulatory-4
      title: "refresh has no baseline unless the lawyer brings one"
      detail: >-
        Nothing written in an earlier session comes back on its own. A refresh
        needs the earlier note and its provision list attached, plus today's
        document. Without them the skill says so in the first reply, names what it
        looked for, and offers a fresh read instead - it never reconstructs the
        baseline, because a reconstructed one compares the model's work against
        itself and comes back looking complete.
      failure: loud
      probe: P2
    - id: KI-regulatory-5
      title: "The jurisdiction registries are a dated snapshot"
      detail: >-
        The seven publisher entries were written upstream and are carried at 16
