  # --- references/version-check.md ------------------------------------------
  - from: |-
      Mechanically first, because a reader who came for Article 6 does not read
      banners and a model reading a page can miss one:

          python3 scripts/fetch_source.py <url> <dir> --publisher <host> --label "<version>" \
              --jurisdiction <code> --profile <profile> --instrument-id <stable-id>
          python3 scripts/read_version.py <dir>/source.html --jurisdiction <code> --json <dir>/version.json

      Non-zero exit means a marker says this text is not what you should be quoting.
      **Refetch the version the marker names.** Do not carry on and caveat it — a
      caveat on a stale quote is still a stale quote.

      No marker matched is not a pass. It means the page did not carry the
      markers the registry expects, which usually means the publisher moved its
      furniture. Establish the version by hand and fix the registry entry.

      The script records this state as `unresolved` and exits non-zero. Downstream
      reliance remains blocked. A superseded version may proceed only when the dated
      research question and the selected historical effective date are both recorded;
      that state is `historical_selected`, not `confirmed` current law.
    to: |-
      Markers first, because a reader who came for Article 6 does not read banners
      and it is easy to miss one. Search the supplied document for the marker text
      the registry entry lists for that jurisdiction, and quote what you find rather
      than summarising it.

      A marker that says this text is superseded or incomplete means this is not the
      text to quote. **Ask for the version the marker names.** Do not carry on and
      caveat it — a caveat on a stale quote is still a stale quote.

      No marker at all is not a pass. It means the document did not carry the markers
      the registry expects, which usually means the publisher moved its furniture, or
      that the entry is older than the page. Establish the version by reading, say
      that is what you did, and note that the entry needs fixing.

      Record that state as unresolved, and treat reliance as blocked: take the
      provisional route at the delivery gate rather than quoting undated words as
      current law. A superseded version may be used only when the dated research
      question and the selected historical effective date are both recorded, and that
      is an explicit historical selection, not confirmed current law.
    files: ["references/version-check.md"]
    expect: 1
  - from: |-
