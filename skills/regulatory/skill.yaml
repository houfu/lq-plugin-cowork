name: regulatory
upstream: core/regulatory
bucket: red
anchored_to: fa5a6681dc3cc9a08fa9ed48a5fd213057edafa0

description: |
  Answers a regulation question from the official text itself: names the
  instrument and the publisher to get it from, waits for the lawyer to put that
  document in the Input folder, reads the version statement off it, and returns
  a note quoting the provisions verbatim with the source filename and a
  provenance block. Also refreshes earlier research against today's text.
  Nothing is quoted that did not come from the publisher's own document. Use
  when the user asks "what does this regulation require", "find me the actual
  text of this rule", "is the copy we hold still current", "has this changed
  since we advised", or "where does this launch plan land". Do not use for
  open-ended research, or where no official document will be supplied (use the
  Deep Research skill), or to find what the firm already holds on a topic (use
  the Enterprise Search skill). Do not use to check the citations in a brief
  against the authorities supplied for it; this skill reads statutes and
  regulations from the publisher's own document.
exclude:
  - "scripts/**"
  - "schemas/**"

files: files

