      ## What gets saved

      Temporary verification uses a workspace run folder. Retain the package only
      when the user asks or agrees; otherwise remove temporary files after delivery
      and disclose that the package has not been retained.

      When it is saved, one folder per instrument, inside the lawyer's own repo:

      ```
      <instrument>/
        source.html        the publisher's bytes, exactly as served
        fetch.json         URL, publisher, HTTP date, retrieval time, sha256
        transformation.json  optional publisher-bytes to derived-text receipt
        version.json       the markers found and what they mean
        provisions.json    provisions, classes, hashes, defined terms, provenance
        note.md            the note as delivered
        run.json           the manifest — which provisions the note rests on
      ```

      ## The manifest

      `run.json` is written by `verify_quotes.py --manifest`, and only from a note in
      which every quote and the complete source lineage verified. It records the
      complete preserved provision set, the provisions actually quoted, and the
      unquoted semantic dependencies supplied with `--depends-on id=reason`.

      `refresh` assesses the complete preserved provision set, then highlights quoted
      and dependency provisions. It refuses different instrument identities and does
      not claim that unchanged quotations preserve the earlier legal conclusion.

      A quotation verified against the earlier run is not reliance on the later one,
      so it is left out of the manifest. The manifest records what the note rests on
      as current law, and a later `refresh` filtered by it would otherwise re-check
      provisions this note only ever quoted in the past tense.

      `source.html` is never edited. It is the thing every later claim is checked
      against, and an edited copy is worth less than no copy.

      Fetch again into a new dated folder rather than overwriting; `refresh` compares the
      two, and it can only compare what is still there.

      For derived text, `transformation.json` uses integrity schema
      `regulatory-integrity/v1` and records `publisher_bytes_sha256`,
      `derived_text_sha256`, `derived_name`, `method`, and the exact tool/version used.
      The receipt binds the conversion; it does not claim the derivative is identical
      to the publisher file.
    to: |-
      ## Going back over the quotes

      Before the note goes to the lawyer — including when it is only going on screen
      — find every quotation again in the supplied document and record the provision
      label and where in the file it sits. A quote that cannot be found is deleted or
      fixed, not caveated — and not restyled, not weakened to a vaguer pinpoint, and
      not moved out of quotation marks. Those all end the complaint without touching
      the problem, and they end it silently.

      Say once, in the verification record, that this pass was run by the same reader
      who wrote the note, and name the file the lawyer would open to repeat it.

      ## What gets written out

      One set per instrument in the session's Output folder, each name carrying the
      instrument and the date of the run:

      ```
      <instrument>-<date>-note.md          the note as delivered
      <instrument>-<date>-provisions.md    provisions, classes, defined terms
      <instrument>-<date>-record.md        provenance block, version findings,
                                           what was quoted and what it rests on
      ```

      The publisher's document stays where the lawyer put it, in the Input folder,
      unedited. It is the thing every later claim is checked against, and an edited
      copy is worth less than no copy. Nothing written here can be deleted, so write
      what the work needs and name the files when you deliver.

      Ask for the document again into a new dated set rather than writing over the
      old one; `refresh` compares the two, and it can only compare what the lawyer
      still has.

      ## What the record holds

      The record names the complete provision set read, the provisions the note
      actually quotes, and the unquoted provisions the analysis depends on — a
      definition, an exception, a commencement provision — with one line each saying
      why. Those are what a later `refresh` has to watch, and they are invisible in
      the note otherwise.

      A `refresh` reads the whole preserved set, then leads with the quoted and
      dependency provisions. It compares only the same instrument, and unchanged
      quotations never stand as proof that the earlier legal conclusion survives.

      A quotation found in the earlier run rather than today's is not reliance on
      today's text, so it is marked as such in the record and left out of what the
      note rests on as current law.

      Where a publisher file had to be converted before it could be read, the record
      says which file, what produced the text, and on what date. It binds the
      conversion to the source; it does not claim the derived text is identical to
      the publisher's file.
    files: ["references/run-format.md"]
    expect: 1

