sections:
  - match: "## Response documents and objection libraries"
    file: sections/response-routes.md

notes: |
  Dropped scripts/ and schemas/ (the objection source-capture, library,
  review and Word-binding tools and their JSON contracts) and the two local
  HTML applications under assets/objection-library/ and assets/objection-review/,
  which cannot run here. The three references that exist only to drive those
  applications — objection-review.md, objection-library-builder.md and
  objection-libraries.md — went with them; every one of their steps is a python
  invocation against an excluded schema. The routes the body already says need
  neither application are what remains: response shells, direct drafting, and
  reuse of a lawyer-approved bank of objection wording. The rewritten section
  keeps the substance those references carried that still applies natively —
  splitting combined responses into individual grounds, consolidating equivalents,
  keeping scope variants, surfacing candidates unchosen with their conditions,
  and the rule that supplying precedent is not approval — and routes the editable
  .docx to the Word skill. assets/rfp-response-shell.docx and the six substantive
  references are kept. docreview is not in this bundle, so the four hand-offs to
  it in the body and two in the references become an explicit out-of-scope
  boundary instead.

triggers:
  positive:
    - "Draft requests for production covering their vendor communications from 2023 to 2025."
    - "Go through their 42 requests and draft our objections and responses request by request."
    - "Has our preservation duty been triggered here, and what should the hold cover?"
    - "Triage this Rule 45 subpoena we received as a non-party and tell me the deadlines and defects."
  negative:
    - "Draft the meet-and-confer letter itself to opposing counsel. -> correspondence"
    - "Plan the 30(b)(6) deposition on their retention practices. -> depositions"
    - "Go through this production and mark what is responsive and privileged. -> none"
    - "Organize the case file and build a chronology from these documents. -> organize-case-docs"
