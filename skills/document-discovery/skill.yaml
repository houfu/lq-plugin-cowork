name: document-discovery
upstream: litigation/document-discovery
bucket: amber
anchored_to: fa5a6681dc3cc9a08fa9ed48a5fd213057edafa0

description: |
  Plans, drafts and analyzes U.S. federal civil preservation and document-discovery work: preservation assessments and legal holds, request sets, itemized responses and objections under Rules 34, 33 and 36, meet-and-confer agendas, subpoena triage, privilege-log queues, and editable response shells to finish in Word. Use when the user asks to "draft requests for production on this issue", "go through their requests and draft our objections", "what should our legal hold cover", "prepare a meet-and-confer agenda", "triage this third-party subpoena", or "build a privilege log queue". Do not use for the letter carrying a discovery position (use the correspondence skill), deposition notices and examination plans (use the depositions skill), organizing or indexing a matter's existing files (use the organize-case-docs skill), preservation posture recorded when a matter is opened (use the new-matter skill), or reviewing an incoming production document by document, which is out of scope.

exclude:
  - "scripts/**"
  - "schemas/**"
  - "assets/objection-library/**"
  - "assets/objection-review/**"
  - "references/objection-libraries.md"
  - "references/objection-library-builder.md"
  - "references/objection-review.md"

