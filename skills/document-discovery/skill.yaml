    to: "If the lawyer has attached an `lqplaybook.md`, or placed one in the session's Input folder, read only its confirmed `[document-discovery]` entries. Do not read any profile file, and never write to the playbook. A preference that emerges during the run is offered as one exact `[document-discovery]` line the lawyer can add to their own file; it shapes future work only once they have added it."
