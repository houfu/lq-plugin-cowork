<!-- Probe P7a template. Fill the three {{placeholders}}; keep everything else exactly as it is, including the footer. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
  :root { --ink: #2d2d2d; --rule: #b8860b; --paper: #fbf8f1; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 16px/1.55 Georgia, "Times New Roman", serif; }
  main { max-width: 42rem; margin: 0 auto; padding: 2.5rem 1rem; }
  .band { border-top: 6px double var(--rule); border-bottom: 1px solid var(--rule);
          padding: .75rem 0; margin-bottom: 1.5rem; letter-spacing: .08em;
          text-transform: uppercase; font-size: .8rem; }
  h1 { font-size: 1.6rem; margin: 0 0 1rem; }
  .summary { border-left: 4px solid var(--rule); padding-left: 1rem; }
  footer { margin-top: 3rem; padding-top: .75rem; border-top: 1px solid var(--rule);
           font: .75rem/1.4 "Courier New", monospace; }
</style>
</head>
<body>
<main>
  <div class="band">Capability probe P7a &middot; one-page summary</div>
  <h1>{{title}}</h1>
  <section class="summary">
    {{summary}}
  </section>
  <p>Prepared {{date}}.</p>
  <footer>
    Template marker: LQC-7A-ORRERY-5382 &middot; probe-template.html
  </footer>
</main>
</body>
</html>
