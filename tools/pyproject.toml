[project]
name = "lqcowork"
version = "0.1.0"
description = "Build LegalQuants Microsoft 365 Copilot Cowork plugin packages from the vendored upstream skills."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["PyYAML>=6.0"]

[project.scripts]
lqcowork = "lqcowork.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "black>=24.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lqcowork"]

[tool.black]
line-length = 88
target-version = ["py311"]

# pytest configuration lives in the repository root pytest.ini.
